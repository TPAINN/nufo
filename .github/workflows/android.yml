name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and a release-code build (unsigned: the signing key never leaves the maintainer's machine)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/