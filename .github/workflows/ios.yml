name: iOS

# macOS minutes are the scarce ones on private repos: run when the iOS app changes, or by hand.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run the unit tests
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project Nufo.xcodeproj -scheme Nufo -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO test | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|Test Suite|Executed|BUILD|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log