name: Nufo
options:
  bundleIdPrefix: com.nufo
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    USDA_API_KEY: DEMO_KEY
targets:
  Nufo:
    type: application
    platform: iOS
    sources: [Nufo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nufo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nufo
        INFOPLIST_KEY_NSCameraUsageDescription: "Nufo uses the camera to read barcodes and photograph food. Frames are analyzed on this iPhone and never uploaded."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Nufo/Info.plist
      properties:
        # Optional free key from https://fdc.nal.usda.gov/api-key-signup (DEMO_KEY is rate-limited).
        USDA_API_KEY: "$(USDA_API_KEY)"
        UILaunchScreen:
          UIColorName: Background
  NufoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NufoTests
      - path: NufoTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Nufo
schemes:
  Nufo:
    build:
      targets:
        Nufo: all
        NufoTests: [test]
    test:
      targets: [NufoTests]